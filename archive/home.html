<!DOCTYPE html>
<html>
    <head>
        <title>pebbles in the rain</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&display=swap');
        
        body{
            color: black;
            background-color: thistle;
            height: 20px;
            font-family: "Atkinson Hyperlegible Mono", serif;
        }

        div{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1000px;
            background-color:aliceblue;            
            text-align: center;
            margin-left: auto;
            margin-right: auto;
            margin-top: auto;
            margin-bottom: auto;

        }

        .notice{
            height: 100px;
            width: 800px;
            margin-left: auto;
            margin-right: auto;
            margin-top: auto;
            margin-bottom: auto;
            text-align: center;
            background-color: rgb(148, 103, 168);
            color: rgb(219, 234, 240);
            font-size: 24px;

            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(129, 91, 170, 0.5);
        }

        .shelf{
            display: grid;
            grid-template-columns: auto auto;
        }
        .shelf div{
            border-radius: 20px;
            width: 400px;
            background-color: blueviolet;
        }
        </style>
    </head>

    <div class="notice">
        This home is under construction, stop by anytime dear earthling
    </div>
    <br>
    <div class="shelf">
        <div>test</div>
        <div>test2</div>
    </div>

</html>
